openapi: 3.1.0
info:
  title: lil-fleet API
  version: 1.0.0
  description: Manifest-locked lifecycle control for Docker-hosted inference models.
servers:
  - url: http://127.0.0.1:8090
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      operationId: health
      responses:
        "200": {description: Process is alive}
  /readyz:
    get:
      security: []
      operationId: ready
      responses:
        "200": {description: Docker state is available}
        "503": {description: Docker state is unavailable, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/models:
    get:
      operationId: listModels
      responses:
        "200":
          description: Configured models with deployment state
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items: {$ref: "#/components/schemas/ModelWithStatus"}
  /v1/gpus:
    get:
      operationId: listGPUs
      description: >-
        GPU inventory from nvidia-smi joined with the manifest topology and Fleet's current GPU
        assignments. The snapshot is cached for about 5 seconds and refreshed by at most one
        nvidia-smi run at a time (5 s timeout). If nvidia-smi fails, the last snapshot is served
        with stale=true while it is under 60 seconds old; otherwise the endpoint returns 503.
      responses:
        "200":
          description: GPU inventory
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GPUInventory"}
        "503": {description: nvidia-smi failed and no recent snapshot exists (code gpu_query_failed), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/models/{modelId}:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    get:
      operationId: getModel
      responses:
        "200": {description: Configured model, content: {application/json: {schema: {$ref: "#/components/schemas/ModelWithStatus"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/models/{modelId}/load:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    post:
      operationId: loadModel
      description: >-
        Empty body preserves the legacy load behavior (ensure at least one instance, keeping a
        larger current replica count). A JSON body with instances requests an exact target replica
        count, so {"instances":1} scales a replicated model down to one. Fleet reserves disjoint
        manifest-approved GPUs and ports before creating new containers. A request above
        max_instances returns 409 insufficient_resources.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoadRequest"}
      responses:
        "200": {description: Model was already ready}
        "202": {$ref: "#/components/responses/OperationAccepted"}
        "400": {description: Invalid body or instance count (code invalid_request), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/models/{modelId}/unload:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    post:
      operationId: unloadModel
      description: Accepts no request body.
      responses:
        "200": {description: Model was already unloaded}
        "202": {$ref: "#/components/responses/OperationAccepted"}
        "400": {description: A request body or override was supplied, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/deployments/switch:
    post:
      operationId: switchModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model_id]
              properties:
                model_id: {type: string}
      responses:
        "200": {description: Model was already ready}
        "202": {$ref: "#/components/responses/OperationAccepted"}
        "400": {description: Invalid body or attempted override, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/deployments:
    get:
      operationId: listDeployments
      responses:
        "200":
          description: All deployment states
          content:
            application/json:
              schema:
                type: object
                required: [deployments]
                properties:
                  deployments:
                    type: array
                    items: {$ref: "#/components/schemas/DeploymentStatus"}
  /v1/deployments/{modelId}:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    get:
      operationId: getDeployment
      responses:
        "200": {description: Deployment state, content: {application/json: {schema: {$ref: "#/components/schemas/DeploymentStatus"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getOperation
      responses:
        "200": {description: Lifecycle operation, content: {application/json: {schema: {$ref: "#/components/schemas/Operation"}}}}
        "404": {description: Unknown operation, or a finished one evicted after one hour or beyond the newest 256, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    ModelId:
      name: modelId
      in: path
      required: true
      schema: {type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$"}
  responses:
    OperationAccepted:
      description: Lifecycle operation accepted
      headers:
        Location:
          schema: {type: string}
      content:
        application/json:
          schema:
            type: object
            required: [changed, operation]
            properties:
              changed: {type: boolean}
              operation: {$ref: "#/components/schemas/Operation"}
    NotFound:
      description: Model or operation not found
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Conflict:
      description: >-
        A conflicting lifecycle operation is active (code operation_in_progress: another operation
        for this model, or any operation when concurrent_deployments is off), or insufficient
        topology-compatible GPUs/ports are free (code insufficient_resources).
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  schemas:
    Model:
      type: object
      required: [id, image]
      properties:
        id: {type: string}
        description: {type: string}
        image: {type: string}
        gpu_count: {type: integer, minimum: 1, description: "GPUs used by one instance: placement.gpu_count, or the count implied by a static gpus value (for example device=0,1). Omitted when the model uses no GPUs or the count is unknown."}
        max_instances: {type: integer, minimum: 1, description: Maximum instances that can fit the configured topology and dynamic port pool}
    LoadRequest:
      type: object
      additionalProperties: false
      required: [instances]
      properties:
        instances:
          type: integer
          minimum: 1
          maximum: 64
          description: Exact desired instance count for this profile. Omit the request body entirely for legacy ensure-loaded behavior.
    GPUInventory:
      type: object
      required: [sampled_at, groups, gpus]
      properties:
        sampled_at: {type: string, format: date-time, description: When the nvidia-smi snapshot was taken.}
        stale: {type: boolean, description: Present and true when nvidia-smi failed and the last good snapshot (under 60 s old) is served.}
        groups:
          type: array
          description: Manifest PCIe topology groups; empty when none is configured.
          items: {type: array, items: {type: integer, minimum: 0}}
        gpus:
          type: array
          items: {$ref: "#/components/schemas/GPU"}
    GPU:
      type: object
      required: [index, name, memory_total_mib, memory_used_mib, memory_free_mib, utilization_percent, group, assigned]
      properties:
        index: {type: integer, minimum: 0}
        name: {type: string}
        memory_total_mib: {type: integer, minimum: 0}
        memory_used_mib: {type: integer, minimum: 0}
        memory_free_mib: {type: integer, minimum: 0}
        utilization_percent: {type: [integer, "null"], minimum: 0, maximum: 100, description: Null when nvidia-smi reports it unavailable.}
        group: {type: [integer, "null"], minimum: 0, description: Index into groups, or null when the GPU is in no group.}
        assigned:
          type: array
          description: Fleet deployment instances holding this GPU, including ones still loading or stopping; empty when free.
          items:
            type: object
            required: [model_id, instance_id]
            properties:
              model_id: {type: string}
              instance_id: {type: string}
    ModelWithStatus:
      type: object
      required: [model, status]
      properties:
        model: {$ref: "#/components/schemas/Model"}
        status: {$ref: "#/components/schemas/DeploymentStatus"}
    DeploymentStatus:
      type: object
      required: [model_id, phase, desired_state, last_checked]
      properties:
        model_id: {type: string}
        phase: {type: string, enum: [unloaded, loading, ready, unhealthy, stopping, failed, unknown]}
        desired_state: {type: string, enum: [unloaded, ready]}
        desired_instances:
          type: integer
          minimum: 0
          description: Target instance count for the current lifecycle intent.
        ready_instances:
          type: integer
          minimum: 0
          description: Number of instances whose phase is ready.
        instances:
          type: array
          description: Per-instance state. The first instance uses the base model ID; replicas use --N suffixes and dynamically assigned ports.
          items: {$ref: "#/components/schemas/InstanceStatus"}
        container_status: {type: string}
        health: {type: string}
        exit_code: {type: integer}
        oom_killed: {type: boolean}
        assigned_gpus:
          type: array
          items: {type: integer, minimum: 0}
        last_error: {type: string, maxLength: 1024, description: Sanitized and redacted diagnostic text.}
        last_checked: {type: string, format: date-time}
    InstanceStatus:
      type: object
      required: [instance_id, index, port, phase, last_checked]
      properties:
        instance_id: {type: string}
        index: {type: integer, minimum: 1}
        port: {type: integer, minimum: 0, maximum: 65535, description: Listener port; 0 when the profile declares none.}
        phase: {type: string, enum: [unloaded, loading, ready, unhealthy, stopping, failed, unknown]}
        container_status: {type: string}
        health: {type: string}
        exit_code: {type: integer}
        oom_killed: {type: boolean}
        assigned_gpus:
          type: array
          items: {type: integer, minimum: 0}
        last_error: {type: string, maxLength: 1024, description: Sanitized and redacted diagnostic text.}
        last_checked: {type: string, format: date-time}
    Operation:
      type: object
      required: [id, kind, model_id, state, created_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [activate, unload]}
        model_id: {type: string}
        instances:
          type: integer
          minimum: 0
          description: Target instance count for this lifecycle operation; unload uses zero.
        state: {type: string, enum: [pending, running, succeeded, failed]}
        error: {type: string, maxLength: 1024, description: Sanitized and redacted failure text.}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
        details: {type: object, additionalProperties: true}
